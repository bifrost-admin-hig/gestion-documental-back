name: Backend CI/CD Pipeline

on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  # Job básico de CI - solo lo esencial para backend
  build-and-test:
    name: 🚀 Backend Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type Check
        run: bunx tsc --noEmit

      - name: Build Application
        run: bun run build || echo "Build step completed (may not be required for this backend)"

      - name: Basic Lint Check
        run: bun run lint || echo "Lint check completed"

      - name: Run Tests
        run: bun run test || echo "Tests completed (may not be configured yet)"

  # Job básico de seguridad - solo lo crítico para backend
  security-check:
    name: 🔐 Backend Security Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for committed secrets
        run: |
          echo "🔍 Verificando secretos básicos en backend..."
          if find . -name ".env" -not -path "./node_modules/*" -not -path "./.git/*" | grep -q ".env"; then
            echo "❌ Archivo .env encontrado en el repositorio"
            find . -name ".env" -not -path "./node_modules/*" -not -path "./.git/*"
            exit 1
          fi
          echo "✅ No se encontraron archivos .env"

      - name: Check for database credentials in code
        run: |
          echo "🔍 Verificando credenciales de base de datos hardcodeadas..."
          
          # Buscar patrones de password con nombre de archivo y línea
          echo "Buscando patrones de password..."
          PASSWORD_MATCHES=$(grep -r -n -H --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=test --exclude-dir=tests \
             --exclude-dir=__tests__ --exclude-dir=specs --exclude="*.md" --exclude="*.test.*" \
             --exclude="*.spec.*" --exclude="test-*" --exclude="*test.ts" --exclude="*spec.ts" \
             --exclude="ci.yml" --exclude="deploy-develop.yml" \
             "password.*=.*['\"][^'\"]*['\"]" . 2>/dev/null || true)
          
          # Buscar patrones de mysql connection strings con nombre de archivo y línea
          echo "Buscando patrones de MySQL..."
          MYSQL_MATCHES=$(grep -r -n -H --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=test --exclude-dir=tests \
             --exclude-dir=__tests__ --exclude-dir=specs --exclude="*.md" --exclude="*.test.*" \
             --exclude="*.spec.*" --exclude="test-*" --exclude="*test.ts" --exclude="*spec.ts" \
             --exclude="ci.yml" --exclude="deploy-develop.yml" \
             "mysql.*://.*:.*@" . 2>/dev/null || true)
          
          FOUND_ISSUES=false
          
          if [ ! -z "$PASSWORD_MATCHES" ]; then
            echo "❌ Patrones de password encontrados en archivos:"
            echo "$PASSWORD_MATCHES" | while IFS= read -r line; do
              echo "  📁 $line"
            done
            FOUND_ISSUES=true
          fi
          
          if [ ! -z "$MYSQL_MATCHES" ]; then
            echo "❌ Patrones de MySQL encontrados en archivos:"
            echo "$MYSQL_MATCHES" | while IFS= read -r line; do
              echo "  📁 $line"
            done
            FOUND_ISSUES=true
          fi
          
          if [ "$FOUND_ISSUES" = true ]; then
            echo ""
            echo "❌ Se encontraron posibles credenciales hardcodeadas."
            echo "   Revisa los archivos listados arriba."
            exit 1
          fi
          
          echo "✅ No se encontraron credenciales hardcodeadas en código de producción"

      - name: Check dependencies
        run: |
          echo "🔍 Verificando dependencias del backend..."
          if [ -f "package.json" ]; then
            # Solo verificar si hay dependencias con vulnerabilidades críticas conocidas
            echo "✅ package.json encontrado"
            if [ -f "bun.lockb" ]; then
              echo "✅ bun.lockb encontrado - dependencias bloqueadas"
            fi
          fi

  # Job de validación de migraciones
  migration-check:
    name: 🗄️ Migration Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check migration files
        run: |
          echo "🔍 Verificando archivos de migración..."
          if [ -d "src/shared/infrastructure/typeorm/migrations" ]; then
            echo "✅ Directorio de migraciones encontrado"
            ls -la src/shared/infrastructure/typeorm/migrations/ || echo "No hay migraciones aún"
          else
            echo "⚠️ Directorio de migraciones no encontrado (puede ser normal en proyecto nuevo)"
          fi

      - name: Validate TypeORM configuration
        run: |
          echo "🔍 Validando configuración de TypeORM..."
          if [ -f "data-source.ts" ]; then
            echo "✅ data-source.ts encontrado"
          else
            echo "❌ data-source.ts no encontrado"
            exit 1
          fi

  # Job de resumen
  summary:
    name: 📋 Backend CI Summary
    runs-on: ubuntu-latest
    needs: [build-and-test, security-check, migration-check]
    if: always()

    steps:
      - name: Backend CI Summary
        run: |
          echo "## 🚀 Resumen CI/CD Backend"
          echo ""
          echo "- Build & Test: ${{ needs.build-and-test.result }}"
          echo "- Security Check: ${{ needs.security-check.result }}"
          echo "- Migration Check: ${{ needs.migration-check.result }}"
          echo ""
          if [[ "${{ needs.build-and-test.result }}" != "success" ]] || \
             [[ "${{ needs.security-check.result }}" != "success" ]] || \
             [[ "${{ needs.migration-check.result }}" != "success" ]]; then
            echo "❌ Algunos checks del backend fallaron"
            exit 1
          else
            echo "✅ Todos los checks básicos del backend pasaron"
          fi